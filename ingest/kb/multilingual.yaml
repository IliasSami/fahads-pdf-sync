# Multilingual knowledge base for search: the same person, place or idea in other languages and traditions.
# Keys are the English names used in the knowledge graph. Every name listed here finds that entry.
# he = Hebrew (and romanized Hebrew), el = Greek, ar = Arabic (Christian Bible form, Quranic form, romanized),
# la = Latin / KJV / older English forms, es = Spanish, pt = Portuguese, fr = French, de = German, ru = Russian.
# Combined with STEPBible TIPNR (Hebrew/Greek forms and KJV spellings for every biblical name) at build time.

